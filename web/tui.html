<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eatsbits // High-Performance Terminal DAW (WebAssembly)</title>
    <link rel="icon" type="image/svg+xml" href="app_icon.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0c0f;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            height: 52px;
            background: #14161c;
            border-bottom: 1px solid #232733;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand svg {
            width: 28px;
            height: 28px;
        }

        .title {
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.05em;
            color: #ff7700;
        }

        .subtitle {
            font-size: 12px;
            color: #717688;
            margin-left: 8px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge {
            background: #1c202a;
            border: 1px solid #2b3142;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-family: monospace;
            color: #00e5ff;
        }

        .btn-start {
            background: linear-gradient(135deg, #ff7700, #ff5500);
            border: none;
            color: white;
            font-weight: 600;
            font-size: 12px;
            padding: 7px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-start:hover {
            filter: brightness(1.15);
            transform: translateY(-1px);
        }

        #terminal-wrapper {
            flex: 1;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d0f14;
        }

        #terminal-container {
            width: 100%;
            height: 100%;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            border: 1px solid #1e222d;
            background: #101012;
        }

        #start-overlay {
            position: absolute;
            top: 52px;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(11, 12, 15, 0.88);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            cursor: pointer;
        }

        .overlay-card {
            background: #151820;
            border: 1px solid #2a3040;
            border-radius: 8px;
            padding: 32px 48px;
            text-align: center;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.8);
        }

        .overlay-card h2 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #ff7700;
        }

        .overlay-card p {
            font-size: 13px;
            color: #8b92a5;
            margin-bottom: 20px;
            max-width: 380px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <svg viewBox="0 0 32 32">
                <rect width="32" height="32" rx="6" fill="#ff7700" />
                <path d="M8 16 L14 10 L14 22 Z M18 10 L24 16 L18 22 Z" fill="#101012" />
            </svg>
            <span class="title">EATSBITS</span>
            <span class="subtitle">// TERMINAL DAW ENGINE</span>
        </div>
        <div class="controls">
            <span class="badge" id="engine-badge">ENGINE: 48kHz / 256smp</span>
            <span class="badge" id="fps-badge">60 FPS</span>
            <button class="btn-start" id="audio-btn">ACTIVATE AUDIO</button>
        </div>
    </header>

    <div id="start-overlay">
        <div class="overlay-card">
            <h2>Start Eatsbits Terminal DAW</h2>
            <p>Click anywhere to unlock browser WebAudio and initialize real-time TB-303 Acid DSP & sub-pixel Braille visualization.</p>
            <button class="btn-start" style="padding: 10px 24px; font-size: 14px;">ENTER WORKSTATION</button>
        </div>
    </div>

    <div id="terminal-wrapper">
        <div id="terminal-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.8.0/lib/addon-fit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.16.0/lib/addon-webgl.js"></script>
    <script>
        const term = new Terminal({
            fontFamily: '"JetBrains Mono", "Fira Code", "Courier New", monospace',
            fontSize: 14,
            theme: {
                background: '#101012',
                foreground: '#f0f0f0',
                cursor: '#ff7700',
                selectionBackground: '#ff770044'
            },
            cursorBlink: true,
            allowProposedApi: true
        });

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);

        const container = document.getElementById('terminal-container');
        term.open(container);
        fitAddon.fit();

        try {
            const webglAddon = new WebglAddon.WebglAddon();
            term.loadAddon(webglAddon);
            console.log('[TUI Web] WebGL Hardware acceleration enabled for terminal.');
        } catch (e) {
            console.warn('[TUI Web] WebGL addon unavailable, using standard renderer.');
        }

        window.addEventListener('resize', () => {
            fitAddon.fit();
        });

        let audioActive = false;
        const overlay = document.getElementById('start-overlay');
        const audioBtn = document.getElementById('audio-btn');

        function activateAudio() {
            if (audioActive) return;
            audioActive = true;
            overlay.style.display = 'none';
            audioBtn.textContent = 'AUDIO ACTIVE';
            audioBtn.style.background = '#00e676';
            audioBtn.style.color = '#101012';

            if (typeof Module !== 'undefined' && Module._eats_tui_start_audio) {
                Module._eats_tui_start_audio();
            }
        }

        overlay.addEventListener('click', activateAudio);
        audioBtn.addEventListener('click', activateAudio);

        // Forward keystrokes to Wasm stdin / input queue
        term.onData(data => {
            if (!audioActive) activateAudio();
            // Stdio forwarding
            if (typeof Module !== 'undefined' && Module.sendInput) {
                Module.sendInput(data);
            }
        });
    </script>
</body>
</html>
